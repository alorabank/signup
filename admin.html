  </div>
  <div class="panel" style="margin-bottom:20px;">
    <h3>Pending approvals <span class="sub" id="appr-sub"></span></h3>
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Customer</th>

    <h3>Accounts <span class="sub" id="admin-sub"></span></h3>
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Account holder</th>
            <th>Email</th>
            <th>Account</th>
            <th>Number</th>
            <th>Balance (USD)</th>
            <th>Status</th>

            <th></th>

<div class="modal-backdrop hidden" id="rec-backdrop">
  <div class="modal">
    <h3>Account record</h3>
    <div class="rec-sub" id="rec-sub"></div>
    <div id="rec-body"></div>
    <div class="actions">
      <button class="btn" id="rec-download">Download .txt</button>
      <button class="btn btn-ghost" id="rec-close">Close</button>
    </div>
  </div>
</div>
<script src="supa.js"></script>
<script>
(function () {
  async function guard() {
    var s = await supa.auth.getSession();
    if (!s.data.session) { window.location.href = 'login.html'; return null; }
    var p = await supa.from('profiles').select('is_admin').eq('id', s.data.session.user.id).single();
    if (p.error || !p.data || !p.data.is_admin) { window.location.href = 'login.html'; return null; }
    return true;
  }

  async function render() {
    var profs = await supa.from('profiles').select('*').eq('is_admin', false).order('created_at', { ascending: false });
    var accts = await supa.from('accounts').select('*').order('opened_at', { ascending: false });
    var users = profs.data || [];
    var all = accts.data || [];
    var byOwner = {};
    users.forEach(function (u) { byOwner[u.id] = u; });

    var total = 0;
    var tb = document.getElementById('admin-tbody');
    tb.innerHTML = '';
    all.forEach(function (a) {
      var u = byOwner[a.owner_id];
      if (!u) return;
      total += Number(a.balance);
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + Alora.escapeHtml(u.full_name) + '</td>' +
        '<td>' + Alora.escapeHtml(u.email) + '</td>' +
        '<td>' + Alora.escapeHtml(a.type) + '</td>' +
        '<td>•••• ' + Alora.escapeHtml(a.number.slice(-4)) + '</td>' +
        '<td><input type="number" min="0" step="0.01" data-id="' + a.id + '" value="' + Number(a.balance).toFixed(2) + '"></td>' +
        '<td><span class="status-pill status-active">Active</span></td>' +
        '<td><button class="btn btn-sm" data-save="' + a.id + '">Save</button></td>' +
        '<td><button class="btn btn-sm btn-ghost" data-record="' + a.id + '">Record</button></td>';
      tb.appendChild(tr);
    });
    document.getElementById('admin-total').innerHTML = '<small>$</small>' + total.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    document.getElementById('admin-count').innerHTML = '<b>' + users.length + '</b> customers · <b>' + tb.rows.length + '</b> accounts';
    document.getElementById('admin-sub').textContent = users.length + ' customers';

    tb.querySelectorAll('button[data-save]').forEach(function (btn) {
      btn.addEventListener('click', async function () {
        var id = btn.getAttribute('data-save');
        var input = tb.querySelector('input[data-id="' + id + '"]');
        var val = Number(input.value);
        if (isNaN(val) || val < 0) { input.style.borderColor = 'var(--red)'; return; }
        btn.disabled = true;
        btn.textContent = 'Saving…';
        var cur = all.find(function (x) { return x.id === id; });
        var diff = Math.round((val - Number(cur.balance)) * 100) / 100;
        var up = await supa.from('accounts').update({ balance: Math.round(val * 100) / 100 }).eq('id', id);
        if (up.error) { btn.textContent = 'Error'; btn.disabled = false; return; }
        if (diff !== 0) {
          await supa.from('transactions').insert({
            account_id: id, description: 'Balance adjustment by administrator', amount: diff
          });
        }
        btn.textContent = 'Saved';
        setTimeout(render, 600);
      });
    });

    // Full signup record per account.
    var currentRec = null;
    tb.querySelectorAll('button[data-record]').forEach(function (btn) {
      btn.addEventListener('click', async function () {
        var id = btn.getAttribute('data-record');
        var a = all.find(function (x) { return x.id === id; });
        var u = byOwner[a.owner_id];
        var depTx = await supa.from('transactions').select('amount').eq('account_id', id)
          .eq('description', 'Initial deposit').order('created_at', { ascending: true }).limit(1);
        var dep = (depTx.data && depTx.data.length) ? Number(depTx.data[0].amount) : 0;
        currentRec = {
          fullName: u.full_name, email: u.email, phone: u.phone || '—', dob: u.dob || '—',
          ssn: u.ssn || '—', address: u.address || '—', city: u.city || '—',
          state: u.state || '—', zip: u.zip || '—',
          accountType: a.type, accountNumber: a.number,
          initialDeposit: dep, openedAt: new Date(a.opened_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
        };
        document.getElementById('rec-sub').textContent = u.full_name + ' · ' + a.type + ' •••• ' + a.number.slice(-4);
        var rows = [
          ['Full name', currentRec.fullName], ['Email', currentRec.email],
          ['Phone', currentRec.phone], ['Date of birth', currentRec.dob],
          ['SSN', currentRec.ssn],
          ['Address', currentRec.address + ', ' + currentRec.city + ', ' + currentRec.state + ' ' + currentRec.zip],
          ['Account type', currentRec.accountType], ['Account number', currentRec.accountNumber],
          ['Initial deposit', Alora.money(currentRec.initialDeposit)],
          ['Current balance', Alora.money(a.balance)],
          ['Opened', currentRec.openedAt]
        ];
        document.getElementById('rec-body').innerHTML = rows.map(function (r) {
          return '<div class="rec-row"><span class="k">' + r[0] + '</span><span class="v">' + Alora.escapeHtml(r[1]) + '</span></div>';
        }).join('');
        document.getElementById('rec-backdrop').classList.remove('hidden');
      });
    });
    document.getElementById('rec-close').addEventListener('click', function () {
      document.getElementById('rec-backdrop').classList.add('hidden');
    });
    document.getElementById('rec-backdrop').addEventListener('click', function (e) {
      if (e.target === this) this.classList.add('hidden');
    });
    document.getElementById('rec-download').addEventListener('click', function () {
      if (!currentRec) return;
      Alora.downloadTxt(
        'AloraBank_Account_' + currentRec.fullName.replace(/[^a-z0-9]+/gi, '_') + '.txt',
        Alora.recordText(currentRec)
      );
    });
  }

  var apprCache = [];

  async function renderApprovals() {
    var q = await supa.from('money_requests').select('*').eq('status', 'pending').order('created_at', { ascending: true });
    var rows = q.data || [];
    apprCache = rows;
    var tb = document.getElementById('appr-tbody');
    tb.innerHTML = '';
    document.getElementById('appr-sub').textContent = rows.length ? rows.length + ' awaiting decision' : 'none pending';
    if (!rows.length) {
      tb.innerHTML = '<tr><td colspan="8" style="color:var(--muted);">No pending requests.</td></tr>';
      return;
    }
    var profs = await supa.from('profiles').select('id, full_name').eq('is_admin', false);
    var accts = await supa.from('accounts').select('id, type, number, balance');
    var names = {}, acctInfo = {};
    (profs.data || []).forEach(function (u) { names[u.id] = u.full_name; });
    (accts.data || []).forEach(function (a) { acctInfo[a.id] = a; });
    var labels = { deposit: 'Deposit', withdrawal: 'Withdrawal', billpay: 'Bill payment' };
    rows.forEach(function (r) {
      var a = acctInfo[r.account_id] || {};
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + Alora.escapeHtml(names[r.owner_id] || '—') + '</td>' +
        '<td>' + labels[r.kind] + '</td>' +
        '<td>' + Alora.escapeHtml(a.type || '—') + ' •••• ' + Alora.escapeHtml((a.number || '').slice(-4)) + '</td>' +
        '<td><strong>' + Alora.money(r.amount) + '</strong></td>' +
        '<td>' + Alora.escapeHtml(r.details || '—') + '</td>' +
        '<td>' + new Date(r.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + '</td>' +
        '<td><button class="btn btn-sm" data-approve="' + r.id + '">Approve</button></td>' +
        '<td><button class="btn btn-sm btn-ghost" data-reject="' + r.id + '">Reject</button></td>';
      tb.appendChild(tr);
    });

    tb.querySelectorAll('button[data-approve]').forEach(function (btn) {
      btn.addEventListener('click', function () { decide(btn.getAttribute('data-approve'), true, btn); });
    });
    tb.querySelectorAll('button[data-reject]').forEach(function (btn) {
      btn.addEventListener('click', function () { decide(btn.getAttribute('data-reject'), false, btn); });
    });
  }

  async function decide(id, approve, btn) {
    btn.disabled = true;
    btn.textContent = '…';
    try {
      var rq = apprCache.find(function (x) { return x.id === id; });
      if (!rq) { renderApprovals(); return; }
      if (!approve) {
        await supa.from('money_requests').update({ status: 'rejected' }).eq('id', id).eq('status', 'pending');
        renderApprovals();
        return;
      }
      // Re-read the account to get the fresh balance.
      var ac = await supa.from('accounts').select('balance, type').eq('id', rq.account_id).single();
      if (ac.error || !ac.data) { btn.textContent = 'Error'; btn.disabled = false; return; }
      var bal = Number(ac.data.balance);
      var amt = Number(rq.amount);
      var signed = rq.kind === 'deposit' ? amt : -amt;
      if (signed < 0 && bal < amt) {
        btn.textContent = 'Insufficient';
        setTimeout(function () { btn.textContent = 'Approve'; btn.disabled = false; }, 1500);
        return;
      }
      // Claim the request first (only if still pending — prevents double-apply).
      var claim = await supa.from('money_requests').update({ status: 'approved' }).eq('id', id).eq('status', 'pending').select();
      if (!claim.data || !claim.data.length) { renderApprovals(); return; }
      var nb = Math.round((bal + signed) * 100) / 100;
      await supa.from('accounts').update({ balance: nb }).eq('id', rq.account_id);
      var desc = rq.kind === 'deposit' ? 'Deposit approved'
        : rq.kind === 'withdrawal' ? 'Withdrawal approved'
        : 'Bill payment approved' + (rq.details ? ' — ' + rq.details : '');
      await supa.from('transactions').insert({ account_id: rq.account_id, description: desc, amount: signed });
      renderApprovals();
      render();
    } catch (e) {
      btn.textContent = 'Error';
      btn.disabled = false;
    }
  }

  document.getElementById('btn-logout').addEventListener('click', async function () {
    await supa.auth.signOut();
    window.location.href = 'login.html';
  });

  guard().then(function (ok) {
    if (!ok) return;
    render();
    renderApprovals();
    // Live: new requests appear without refresh.
    supa.channel('approvals')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'money_requests' }, function () {
        renderApprovals();
        render();
      })
      .subscribe();
  });
})();
</script>
