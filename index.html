<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alora Bank — Open an Account</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <img class="brand-mark" src="logo.webp" alt="Alora Bank">
    <div class="brand-name">Alora <span>Bank</span></div>
  </div>
  <div class="user-chip"><a href="login.html" class="link-btn">Back to sign in</a></div>
</div>
<div class="container narrow">
  <div class="page-head">
    <h1>Open an account</h1>
    <p>Complete the application below. Your account opens instantly after confirmation.</p>
  </div>
  <div class="form-card">
    <form id="open-form" novalidate>
      <div class="form-grid">
        <div class="field full">
          <label for="f-name">Full legal name</label>
          <input id="f-name" type="text" placeholder="Jane A. Doe" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="f-ssn">Social Security Number</label>
          <input id="f-ssn" type="text" inputmode="numeric" placeholder="123-45-6789" required>
        </div>
        <div class="field">
          <label for="f-dob">Date of birth</label>
          <input id="f-dob" type="date" required>
        </div>
        <div class="field">
          <label for="f-email">Email address</label>
          <input id="f-email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="f-phone">Phone number</label>
          <input id="f-phone" type="tel" placeholder="+1 (555) 000-0000" autocomplete="tel" required>
        </div>
        <div class="field full">
          <label for="f-address">Street address</label>
          <input id="f-address" type="text" placeholder="123 Main Street, Apt 4B" autocomplete="street-address" required>
        </div>
        <div class="field">
          <label for="f-city">City</label>
          <input id="f-city" type="text" placeholder="New York" autocomplete="address-level2" required>
        </div>
        <div class="field">
          <label for="f-zip">ZIP code</label>
          <input id="f-zip" type="text" inputmode="numeric" placeholder="10001" autocomplete="postal-code" required>
        </div>
        <div class="field">
          <label for="f-type">Account type</label>
          <select id="f-type">
            <option value="Checking">Checking</option>
            <option value="Savings">Savings</option>
          </select>
        </div>
        <div class="field">
          <label for="f-deposit">Initial deposit (USD)</label>
          <input id="f-deposit" type="number" min="0" step="0.01" placeholder="0.00" required>
        </div>
        <div class="field">
          <label for="f-password">Create password</label>
          <input id="f-password" type="password" placeholder="••••••••" autocomplete="new-password" required>
        </div>
        <div class="field">
          <label for="f-password2">Confirm password</label>
          <input id="f-password2" type="password" placeholder="••••••••" autocomplete="new-password" required>
        </div>
      </div>
      <div class="form-error" id="form-error"></div>
      <button class="btn" type="submit" id="btn-submit">Confirm &amp; Open Account</button>
    </form>
  </div>
</div>
<script src="supa.js"></script>
<script>
(function () {
  var form = document.getElementById('open-form');
  var errBox = document.getElementById('form-error');
  var btn = document.getElementById('btn-submit');
  function val(id) { return document.getElementById(id).value.trim(); }
  function fail(msg) { errBox.textContent = msg; btn.disabled = false; btn.textContent = 'Confirm & Open Account'; }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    errBox.textContent = '';
    var v = {
      fullName: val('f-name'), ssn: val('f-ssn'), dob: val('f-dob'),
      email: val('f-email').toLowerCase(), phone: val('f-phone'),
      address: val('f-address'), city: val('f-city'), zip: val('f-zip'),
      accountType: val('f-type'), deposit: val('f-deposit'),
      password: document.getElementById('f-password').value,
      password2: document.getElementById('f-password2').value
    };
    if (!v.fullName || !v.ssn || !v.dob || !v.email || !v.phone || !v.address || !v.city || !v.zip || v.deposit === '' || !v.password) {
      errBox.textContent = 'All fields are required.'; return;
    }
    if (!/^\d{3}-\d{2}-\d{4}$/.test(v.ssn)) { errBox.textContent = 'SSN must be in the format 123-45-6789.'; return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) { errBox.textContent = 'Enter a valid email address.'; return; }
    var dep = Number(v.deposit);
    if (isNaN(dep) || dep < 0) { errBox.textContent = 'Initial deposit must be zero or more.'; return; }
    if (v.password.length < 6) { errBox.textContent = 'Password must be at least 6 characters.'; return; }
    if (v.password !== v.password2) { errBox.textContent = 'Passwords do not match.'; return; }

    btn.disabled = true;
    btn.textContent = 'Opening your account…';

    try {
      // 1. Create the auth user (real login, works on any device).
      var sign = await supa.auth.signUp({ email: v.email, password: v.password });
      if (sign.error) { fail(sign.error.message); return; }
      var user = sign.data.user;
      if (!user) { fail('Could not create the login. Please try again.'); return; }

      // If email confirmation is on, there is no session yet.
      var session = sign.data.session;
      if (!session) {
        var s2 = await supa.auth.getSession();
        session = s2.data.session;
      }

      var acctNo = Alora.genAccountNumber();
      var openedAt = Alora.todayStr();

      // 2. Profile row (RLS: users can only insert their own).
      var prof = await supa.from('profiles').insert({
        id: user.id, full_name: v.fullName, email: v.email, phone: v.phone,
        dob: v.dob, ssn: v.ssn, address: v.address, city: v.city, zip: v.zip
      });
      if (prof.error) { fail('Account created, but saving details failed: ' + prof.error.message); return; }

      // 3. Bank account.
      var acct = await supa.from('accounts').insert({
        owner_id: user.id, type: v.accountType, number: acctNo, balance: dep
      }).select().single();
      if (acct.error) { fail('Details saved, but opening the bank account failed: ' + acct.error.message); return; }

      // 4. Initial deposit transaction.
      if (dep > 0) {
        await supa.from('transactions').insert({
          account_id: acct.data.id, description: 'Initial deposit', amount: dep
        });
      }

      // 5. Download the .txt record, then go to the login page.
      Alora.downloadTxt(
        'AloraBank_Account_' + v.fullName.replace(/[^a-z0-9]+/gi, '_') + '.txt',
        Alora.recordText({
          fullName: v.fullName, email: v.email, phone: v.phone, dob: v.dob,
          address: v.address, city: v.city, zip: v.zip, accountType: v.accountType,
          accountNumber: acctNo, initialDeposit: dep, openedAt: openedAt
        })
      );

      if (!session) {
        errBox.textContent = 'Account created — check your email to confirm, then sign in.';
        btn.disabled = false;
        btn.textContent = 'Confirm & Open Account';
        return;
      }
      window.location.href = 'login.html';
    } catch (err) {
      fail('Something went wrong. Please try again.');
    }
  });
})();
</script>
</body>
</html>
