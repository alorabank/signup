<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alora Bank — Open an Account</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="topbar">
  <div class="brand">
    <div class="brand-mark">A</div>
    <div class="brand-name">Alora <span>Bank</span></div>
  </div>
  <div class="user-chip"><a href="login.html" class="link-btn">Back to sign in</a></div>
</div>
<div class="container narrow">
  <div class="page-head">
    <h1>Open an account</h1>
    <p>Complete the application below. Your account opens instantly after confirmation.</p>
  </div>
  <div class="form-card">
    <form id="open-form" novalidate>
      <div class="form-grid">
        <div class="field full">
          <label for="f-name">Full legal name</label>
          <input id="f-name" type="text" placeholder="Jane A. Doe" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="f-ssn">Social Security Number</label>
          <input id="f-ssn" type="text" inputmode="numeric" placeholder="123-45-6789" required>
        </div>
        <div class="field">
          <label for="f-dob">Date of birth</label>
          <input id="f-dob" type="date" required>
        </div>
        <div class="field">
          <label for="f-email">Email address</label>
          <input id="f-email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="f-phone">Phone number</label>
          <input id="f-phone" type="tel" placeholder="+1 (555) 000-0000" autocomplete="tel" required>
        </div>
        <div class="field full">
          <label for="f-address">Street address</label>
          <input id="f-address" type="text" placeholder="123 Main Street, Apt 4B" autocomplete="street-address" required>
        </div>
        <div class="field">
          <label for="f-city">City</label>
          <input id="f-city" type="text" placeholder="New York" autocomplete="address-level2" required>
        </div>
        <div class="field">
          <label for="f-zip">ZIP code</label>
          <input id="f-zip" type="text" inputmode="numeric" placeholder="10001" autocomplete="postal-code" required>
        </div>
        <div class="field">
          <label for="f-type">Account type</label>
          <select id="f-type">
            <option value="Checking">Checking</option>
            <option value="Savings">Savings</option>
          </select>
        </div>
        <div class="field">
          <label for="f-deposit">Initial deposit (USD)</label>
          <input id="f-deposit" type="number" min="0" step="0.01" placeholder="0.00" required>
        </div>
        <div class="field">
          <label for="f-password">Create password</label>
          <input id="f-password" type="password" placeholder="••••••••" autocomplete="new-password" required>
        </div>
        <div class="field">
          <label for="f-password2">Confirm password</label>
          <input id="f-password2" type="password" placeholder="••••••••" autocomplete="new-password" required>
        </div>
      </div>
      <div class="form-error" id="form-error"></div>
      <button class="btn" type="submit">Confirm &amp; Open Account</button>
    </form>
  </div>
</div>
<script src="app.js"></script>
<script>
(function () {
  var form = document.getElementById('open-form');
  var errBox = document.getElementById('form-error');
  function val(id) { return document.getElementById(id).value.trim(); }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errBox.textContent = '';
    var v = {
      fullName: val('f-name'), ssn: val('f-ssn'), dob: val('f-dob'),
      email: val('f-email').toLowerCase(), phone: val('f-phone'),
      address: val('f-address'), city: val('f-city'), zip: val('f-zip'),
      accountType: val('f-type'), deposit: val('f-deposit'),
      password: document.getElementById('f-password').value,
      password2: document.getElementById('f-password2').value
    };
    if (!v.fullName || !v.ssn || !v.dob || !v.email || !v.phone || !v.address || !v.city || !v.zip || v.deposit === '' || !v.password) {
      errBox.textContent = 'All fields are required.';
      return;
    }
    if (!/^\d{3}-\d{2}-\d{4}$/.test(v.ssn)) {
      errBox.textContent = 'SSN must be in the format 123-45-6789.';
      return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) {
      errBox.textContent = 'Enter a valid email address.';
      return;
    }
    var dep = Number(v.deposit);
    if (isNaN(dep) || dep < 0) {
      errBox.textContent = 'Initial deposit must be zero or more.';
      return;
    }
    if (v.password.length < 6) {
      errBox.textContent = 'Password must be at least 6 characters.';
      return;
    }
    if (v.password !== v.password2) {
      errBox.textContent = 'Passwords do not match.';
      return;
    }
    var db = Alora.loadDb();
    if (db.users[v.email]) {
      errBox.textContent = 'An account with this email already exists. Please sign in.';
      return;
    }
    var acctNo = Alora.genAccountNumber();
    var openedAt = Alora.todayStr();
    var txns = [];
    if (dep > 0) {
      txns.push({ desc: 'Initial deposit', date: openedAt, amount: dep, iso: Alora.nowIso() });
    }
    db.users[v.email] = {
      fullName: v.fullName, ssn: v.ssn, dob: v.dob, email: v.email,
      phone: v.phone, address: v.address, city: v.city, zip: v.zip,
      password: v.password,
      accounts: [{
        type: v.accountType, number: acctNo, balance: dep,
        openedAt: openedAt, transactions: txns
      }]
    };
    Alora.saveDb(db);

    var rec = {
      fullName: v.fullName, ssn: v.ssn, dob: v.dob, email: v.email,
      phone: v.phone, address: v.address, city: v.city, zip: v.zip,
      accountType: v.accountType, accountNumber: acctNo,
      initialDeposit: dep, openedAt: openedAt
    };
    var fname = 'AloraBank_Account_' + v.fullName.replace(/[^a-z0-9]+/gi, '_') + '.txt';
    Alora.downloadTxt(fname, Alora.recordText(rec));

    Alora.setSession(v.email);
    window.location.href = 'login.html';
  });
})();
</script>
</body>
</html>
