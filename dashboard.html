<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alora Bank — Dashboard</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="topbar">
  <div class="brand">
    <div class="brand-mark">A</div>
    <div class="brand-name">Alora <span>Bank</span></div>
  </div>
  <div class="user-chip">
    <span>Welcome, <strong id="dash-username">—</strong></span>
    <button class="link-btn" id="btn-logout">Sign out</button>
  </div>
</div>
<div class="container">
  <div class="hero">
    <div class="label">Total Balance</div>
    <div class="value" id="hero-balance"><small>$</small>0.00</div>
    <div class="plan" id="hero-sub">—</div>
  </div>
  <div class="cards" id="account-cards"></div>
  <div class="grid-2">
    <div class="panel">
      <h3>Recent transactions</h3>
      <ul class="tx-list" id="tx-list"></ul>
    </div>
    <div class="panel">
      <h3>Transfer funds</h3>
      <div class="money-forms">
        <div class="money-box">
          <h4>Between my accounts</h4>
          <div class="field">
            <label for="t-from">From</label>
            <select id="t-from"></select>
          </div>
          <div class="field">
            <label for="t-to">To</label>
            <select id="t-to"></select>
          </div>
          <div class="field">
            <label for="t-amount">Amount (USD)</label>
            <input id="t-amount" type="number" min="0.01" step="0.01" placeholder="0.00">
          </div>
          <button class="btn btn-sm" id="btn-transfer">Transfer</button>
          <div class="money-msg" id="t-msg"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="app.js"></script>
<script>
(function () {
  var email = Alora.getSession();
  if (!email) { window.location.href = 'login.html'; return; }
  var db = Alora.loadDb();
  var user = db.users[email];
  if (!user || user.isAdmin) { window.location.href = 'login.html'; return; }

  document.getElementById('dash-username').textContent = user.fullName.split(' ')[0];

  function render() {
    var total = user.accounts.reduce(function (s, a) { return s + a.balance; }, 0);
    document.getElementById('hero-balance').innerHTML = '<small>$</small>' + total.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    document.getElementById('hero-sub').innerHTML = 'Member since <b>' + (user.accounts[0] ? user.accounts[0].openedAt : '—') + '</b>';

    var cards = document.getElementById('account-cards');
    cards.innerHTML = '';
    user.accounts.forEach(function (a) {
      var d = document.createElement('div');
      d.className = 'card';
      d.innerHTML = '<div class="label">' + a.type + ' account</div>' +
        '<div class="big">' + Alora.money(a.balance) + '</div>' +
        '<div class="meta">•••• ' + a.number.slice(-4) + '</div>';
      cards.appendChild(d);
    });

    var all = [];
    user.accounts.forEach(function (a) {
      (a.transactions || []).forEach(function (t) {
        all.push({ a: a, t: t });
      });
    });
    all.sort(function (x, y) { return (y.t.iso || '') < (x.t.iso || '') ? -1 : 1; });
    var list = document.getElementById('tx-list');
    list.innerHTML = '';
    if (!all.length) {
      list.innerHTML = '<div class="tx-empty">No transactions yet.</div>';
    } else {
      all.slice(0, 20).forEach(function (row) {
        var li = document.createElement('li');
        var cls = row.t.amount >= 0 ? 'in' : 'out';
        var sign = row.t.amount >= 0 ? '+' : '−';
        li.innerHTML = '<div><div>' + row.t.desc + '</div><div class="tx-meta">' + row.a.type + ' •••• ' + row.a.number.slice(-4) + ' · ' + row.t.date + '</div></div>' +
          '<div class="tx-amt ' + cls + '">' + sign + Alora.money(Math.abs(row.t.amount)).slice(0) + '</div>';
        list.appendChild(li);
      });
    }

    var from = document.getElementById('t-from');
    var to = document.getElementById('t-to');
    from.innerHTML = ''; to.innerHTML = '';
    user.accounts.forEach(function (a, i) {
      var o1 = document.createElement('option');
      o1.value = i; o1.textContent = a.type + ' •••• ' + a.number.slice(-4);
      var o2 = o1.cloneNode(true);
      from.appendChild(o1); to.appendChild(o2);
    });
    if (user.accounts.length > 1) to.selectedIndex = 1;
  }

  document.getElementById('btn-transfer').addEventListener('click', function () {
    var msg = document.getElementById('t-msg');
    msg.textContent = ''; msg.className = 'money-msg';
    var fi = Number(document.getElementById('t-from').value);
    var ti = Number(document.getElementById('t-to').value);
    var amt = Number(document.getElementById('t-amount').value);
    if (fi === ti) { msg.textContent = 'Choose two different accounts.'; msg.classList.add('err'); return; }
    if (!(amt > 0)) { msg.textContent = 'Enter an amount greater than zero.'; msg.classList.add('err'); return; }
    if (user.accounts[fi].balance < amt) { msg.textContent = 'Insufficient funds.'; msg.classList.add('err'); return; }
    var date = Alora.todayStr(), iso = Alora.nowIso();
    user.accounts[fi].balance = Math.round((user.accounts[fi].balance - amt) * 100) / 100;
    user.accounts[ti].balance = Math.round((user.accounts[ti].balance + amt) * 100) / 100;
    user.accounts[fi].transactions.push({ desc: 'Transfer to ' + user.accounts[ti].type, date: date, amount: -amt, iso: iso });
    user.accounts[ti].transactions.push({ desc: 'Transfer from ' + user.accounts[fi].type, date: date, amount: amt, iso: iso });
    db.users[email] = user;
    Alora.saveDb(db);
    document.getElementById('t-amount').value = '';
    msg.textContent = 'Transfer complete.';
    msg.classList.add('ok');
    render();
  });

  document.getElementById('btn-logout').addEventListener('click', function () {
    Alora.setSession(null);
    window.location.href = 'login.html';
  });

  render();
})();
</script>
</body>
</html>
