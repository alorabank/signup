<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alora Bank — Sign In</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark">A</div>
      <div class="brand-name">Alora <span>Bank</span></div>
    </div>
    <p class="login-sub">Sign in to your account</p>
    <form id="login-form">
      <div class="field">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <div class="field">
        <label for="login-role">Sign in as</label>
        <select id="login-role">
          <option value="customer">Customer</option>
          <option value="admin">Administrator</option>
        </select>
      </div>
      <button class="btn" type="submit">Sign In</button>
      <div class="form-error" id="login-error"></div>
    </form>
    <div class="login-alt">New to Alora Bank? <a href="index.html">Open an account</a></div>
  </div>
</div>
<script src="app.js"></script>
<script>
(function () {
  var form = document.getElementById('login-form');
  var errBox = document.getElementById('login-error');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var email = document.getElementById('login-email').value.trim().toLowerCase();
    var password = document.getElementById('login-password').value;
    var role = document.getElementById('login-role').value;
    errBox.textContent = '';
    if (!email || !password) {
      errBox.textContent = 'Enter your email and password.';
      return;
    }
    var db = Alora.loadDb();
    var user = db.users[email];
    if (!user) {
      errBox.textContent = 'No account found for this email.';
      return;
    }
    if (user.password !== password) {
      errBox.textContent = 'Incorrect password.';
      return;
    }
    if (role === 'admin' && !user.isAdmin) {
      errBox.textContent = 'This account does not have administrator access.';
      return;
    }
    Alora.setSession(email);
    window.location.href = role === 'admin' ? 'admin.html' : 'dashboard.html';
  });
})();
</script>
</body>
</html>
